<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="On October 24, 2026, more than 3,500 people came to Ajax for Durham Region's first Diwali festival, with music, dance, food and the region's first Diwali drone show."
    />
    <meta property="og:title" content="Durham Diwali Festival 2026" />
    <meta
      property="og:description"
      content="Durham Region's first Diwali festival brought more than 3,500 people to Ajax on October 24, 2026."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://diwalifestdurham.netlify.app/" />
    <meta property="og:image" content="https://diwalifestdurham.netlify.app/logo.jpg" />
    <meta property="og:image:alt" content="Durham Diwali Festival logo" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://diwalifestdurham.netlify.app/" />
    <title>Durham Diwali Festival 2026 | Festival of Lights in Ajax</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Mukta:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detection: Netlify's build bot parses the built, static
      HTML for <form> tags — it cannot see forms injected by React at
      runtime. These hidden forms are never rendered or shown to users;
      they exist only so Netlify registers the form names/fields at deploy
      time. The real forms in React submit to these same names via fetch.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
